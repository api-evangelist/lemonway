              schema:
                $ref: '#/components/schemas/MoneyInMultibancoInitOutput'
              examples:
                response:
                  value:
                    euPagoInit:
                      id: 589
                      reference: '000257.45875687'
        '401':
          description: Unauthorized
        '500':
          description: InternalServerError
