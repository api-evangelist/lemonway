openapi: 3.2.0
info:
  version: v2
  title: Lemonway DirectKit API 2.0 MoneyIns | Local Payments API
servers:
- url: https://ws.lemonway.fr/mb/env-name/prod/directkitrest/
tags:
- name: MoneyIns | Local Payments
paths:
  /v2/moneyins/mbway/init:
    post:
      tags:
      - MoneyIns | Local Payments
      summary: Initialize MB WAY Payment
      description: 'Payment process:


        You call the Lemonway DirectKit API, provide a phone number to initialize the payment


        The payment order is sent to the customer''s smartphone


        The customer pays with their smartphone


        You will be notified after the payment is settled'
      operationId: MoneyIns_MbwayInitPost
      parameters:
      - name: Authorization
        in: header
        description: Authorization bearer (OAuth 2)
        required: true
        schema:
          type: string
      - name: PSU-Accept-Language
        in: header
        description: Response language accepted by final client (PSU). English by default
        required: false
        schema:
          type: string
      - name: PSU-IP-Address
        in: header
        description: IP address of the final client (PSU).
        required: true
        schema:
          type: string
      - name: PSU-User-Agent
        in: header
        description: User-agent of the final client (PSU).
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoneyInMbwayInitInput'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoneyInMbwayInitOutput'
              examples:
                response:
                  value:
                    euPagoInit:
                      id: 589
                      reference: '00000.425'
        '401':
          description: Unauthorized
        '500':
          description: InternalServerError
