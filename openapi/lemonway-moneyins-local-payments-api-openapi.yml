          type: string
        finalCustomerLastName:
          description: End user last name
          type: string
        returnUrl:
          description: 'Your site returns the URL, called to terminate the operation and on which the callback will be sent, with data in POST parameters.

            This URL must contain a unique ID so you know which operation is related to the return.'
          type: string
        reference:
          description: Unique ID of the call, generated by your server. This ID can be used as a search field when looking for operation details
          maxLength: 50
          minLength: 0
          type: string
        accountId:
          description: Payment Account ID to Credit
          maxLength: 256
          minLength: 0
          type: string
        totalAmount:
          format: int32
          description: 'Amount to Debit

            Amounts are given as integer numbers in cents'
          type: integer
        commissionAmount:
          format: int32
          description: 'Your Fee

            Amounts are given as integer numbers in cents'
          type: integer
        comment:
          description: Comment Regarding the Transaction
          maxLength: 140
          minLength: 0
          type: string
        autoCommission:
          description: "If true:\n1. [amountCom] will be ignored and will be replaced with Lemonway's fee  \n2. You will not receive any fee"
          type: boolean
      example:
        finalCustomerEmail: wade.winston@email.com
        finalCustomerFirstName: Wade
        finalCustomerLastName: Winston
        returnUrl: https://www.yoursite.com/payment_return.php/?id=367GBD
        reference: Dze8778
        accountId: '33612345678'
        totalAmount: 1500
        commissionAmount: 100
        comment: Order number 2457765AX2
        autoCommission: false
