        schema:
          type: string
          minLength: 0
          maxLength: 50
      - name: startDate
        in: query
        description: UTC Unix timestamp, in order to return transactions initialized after it
        required: false
        schema:
          type: string
          pattern: ^-?\d{1,12}$
      - name: endDate
        in: query
        description: UTC Unix timestamp, in order to return transactions initialized before it
        required: false
        schema:
          type: string
          pattern: ^-?\d{1,12}$
      - name: page
        in: query
        description: Index start from 1, let null to get all
        required: false
