        lastNamePayer:
          description: 'Payer''s Last Name

            If this field is not filled then the end-user have to fill it in the payment form.'
          type: string
        emailPayer:
          description: 'Payer''s Email

            If this field is not filled then the end-user have to fill it in the payment form.'
