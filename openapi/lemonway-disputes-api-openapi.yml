openapi: 3.2.0
info:
  version: v2
  title: Lemonway DirectKit API 2.0 Disputes API
servers:
- url: https://ws.lemonway.fr/mb/env-name/prod/directkitrest/
tags:
- name: Disputes
paths:
  /v2/disputes:
    get:
      tags:
      - Disputes
      summary: Get list of disputes from a given date
      operationId: Disputes_DisputesGet
      parameters:
      - name: updateDate
        in: query
        description: UTC Unix timestamp
        required: true
        schema:
          type: string
          pattern: ^-?\d{1,12}$
      - name: page
        in: query
        description: Index start from 1, let null to get all
        required: false
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        description: Default 20, let it null if no pagination
        required: false
        schema:
          type: integer
          format: int32
      - name: Authorization
        in: header
        description: Authorization bearer (OAuth 2)
        required: true
        schema:
          type: string
      - name: PSU-Accept-Language
        in: header
        description: Response language accepted by final client (PSU). English by default
        required: false
        schema:
          type: string
      - name: PSU-IP-Address
        in: header
        description: IP address of the final client (PSU).
        required: true
        schema:
          type: string
      - name: PSU-User-Agent
        in: header
        description: User-agent of the final client (PSU).
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetChargebacksOutput'
              examples:
                response:
                  value:
                    transactions:
                      value:
                      - senderAccountId: Pizza
                        debitAmount: 1500
                        IbanId: 0
                        originId: 90
                        id: 255
                        method: 0
                        date: 1784563474
                        commissionAmount: 1000
                        comment: chargeback
                        status: 0
                        executionDate: 0
                        reference: null
        '401':
          description: Unauthorized
        '500':
          description: InternalServerError
components:
  schemas:
    Link:
      type: object
      properties:
        href:
          type: string
        templated:
          type: boolean
          readOnly: true
        method:
          type: string
        type:
          type: string
        deprecation:
          type: string
        name:
          type: string
        profile:
          type: string
        title:
          type: string
        hreflang:
          type: string
    TransactionOut:
      type: object
      properties:
        senderAccountId:
          description: Debited Account
          type: string
        debitAmount:
          format: int32
          description: 'Debited Amount

            Amounts are represented in cents (Euros)'
          type: integer
        IbanId:
          format: int64
          description: IBAN ID
          type: integer
        maskedLabel:
          type: string
        bankStatus:
          type: string
        PSP:
          $ref: '#/components/schemas/PSP'
        originId:
          format: int64
          description: Money-In - ID responsible for the chargeback
          type: integer
        buyNowPayLaterInfo:
          $ref: '#/components/schemas/BnplInfo'
        id:
          format: int64
          description: Transaction ID
          type: integer
        method:
          format: int32
          description: "Payment Method  \n0 Card    \n1 Bank transfer (MoneyIn)     \n3 Bank transfer (MoneyOut)     \n4 P2P    \n13 iDEAL    \n14 SEPA DirectDebit    \n15 Cheque    \n19 Multibanco    \n21 MBWAY    \n30 BNPL  \n35 PayPal\n\n ---\n **Important:** The following services have been discontinued. \n \n16 Neosurf  \n17 Sofort  \n18 PFS Physical Card  \n20 Payshop  \n22 Polish Instant Transfer  \n23 Pagare  \n24 MobilePay\n25 Paytrail\n26 WeChat  \n27 P24  \n28 MoneyIn by TPE  \n29 Trustly"
          type: integer
        methodDetails:
          format: int32
          description: 'Payment Method Details

            0 Standard

            1 Pay By Bank<br/>0 = STANDARD.<br/>1 = PAY_BY_BANK.<br/>'
          enum:
          - 0
          - 1
          type: integer
        date:
          format: int32
          description: Transaction initialization date, UTC Unix timestamp
          type: integer
        commissionAmount:
          format: int32
          description: 'Your fee

            Amounts are given as integer numbers in cents'
          type: integer
        comment:
          description: Comment
          type: string
        status:
          format: int32
          description: "**For the following endpoints uses the below status code**   \n  \n/v2/accounts/{accountId}/transactions\n/v2/moneyins\n/v2/moneyins/card/direct\n/v2/moneyins/card/{cardid}/rebill\n/v2/moneyins/card/{cardid}/subscription\n/v2/moneyins/{transactionid}/validate\n/v2/moneyins/sdd/init\n/v2/moneyins/sdd\n/v2/moneyins/{transactionid}/cancel\n/v2/refund/{transactionid}\n/v2/refundcreate/{transactionId}\n            \n0: Success  \n3: Lemonway Error  \n4: Pending  \n6: PSP error  \n7: Cancelled  \n16: Validation pending  \n\n**For the following endpoints uses the below status code**  \n\n/v2/disputes\n/v2/moneyins/bankwire\n/v2/moneyins/card/direct/3dinit\n/v2/moneyouts\n/v2/p2p\n/v2/p2p/{transactionid?}\n            \n0: Waiting for finalization    \n3: Success    \n4: Lemonway Error"
          type: integer
        executionDate:
          format: int32
          description: Transaction execution date
          type: integer
        lemonWayCommission:
          $ref: '#/components/schemas/LemonWayCommission'
        reference:
          description: Unique ID generated by your server
          type: string
    LemonWayCommission:
      type: object
      properties:
        idp2p:
          type: string
        amount:
          format: int32
          description: 'Amounts are represented as integer in cents (Euro)

            Represented as an integer in cents (Euro)'
          type: integer
    Error:
      type: object
      properties:
        code:
          format: int32
          type: integer
        message:
          type: string
        psp:
          $ref: '#/components/schemas/PSP'
    BnplInfo:
      type: object
      properties:
        paymentPlanId:
          format: int64
          description: Payment Plan ID
          type: integer
        type:
          description: Payment plan type.
          type: string
        secondInstallmentPaymentDate:
          description: 'Second installment payment date.

            Format: yyyy-MM-dd'
          type: string
        deferredPaymentDate:
          description: 'Deferred payment date.

            Format: yyyy-MM-dd'
          type: string
    Links:
      type: object
      properties:
        first:
          $ref: '#/components/schemas/Link'
        last:
          $ref: '#/components/schemas/Link'
        previous:
          $ref: '#/components/schemas/Link'
        next:
          $ref: '#/components/schemas/Link'
        self:
          $ref: '#/components/schemas/Link'
    GetChargebacksOutput:
      type: object
      properties:
        transactions:
          $ref: '#/components/schemas/Transactions_TransactionOut'
        _links:
          $ref: '#/components/schemas/Links'
        error:
          $ref: '#/components/schemas/Error'
    PSP:
      type: object
      properties:
        message:
          description: Get the Error Message from PSP
          type: string
    Transactions_TransactionOut:
      type: object
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/TransactionOut'
