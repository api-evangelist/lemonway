      properties:
        status:
          type: string
          enum:
          - 'YES'
          - 'NO'
          - CLOSE
          description: Politically exposed person status
          example: 'Yes'
        position:
          type: string
          enum:
          - POLITICAL_LEADER
          - POLITICAL_REPRESENTATIVE
          - JUDICIAL_OFFICIAL
          - FINANCIAL_AUDITOR
          - BANK_EXECUTIVE
          - DIPLOMATIC_REPRESENTATIVE
          - MILITARY_LEADER
          - ADMINISTRATIVE_OFFICIAL
          - ORGANIZATIONAL_OFFICIAL
          - OTHER
          description: There are 9 identified positions and one option to state another if not on the list
          example: POLITICAL_LEADER
        startDate:
          type: string
          description: 'Format: YYYY-MM-DD'
          example: '1980-07-10'
        endDate:
          type: string
          description: 'Format: YYYY-MM-DD. If unknown, not required'
          example: '2001-07-10'
        fullName:
          type: string
          description: Full legal name of the politically exposed person
          example: Michael James
        closeRelationship:
          type: string
          enum:
          - PARTNER
          - CHILD
          - PARENT
          description: CloseRelationshipType
          example: Child
        otherPosition:
          type: string
          description: State official position if not in provided list
      required:
      - status
      description: Political exposure details (PEP status)
