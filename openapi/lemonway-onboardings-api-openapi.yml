openapi: 3.2.0
info:
  title: Account & Onboarding Management Onboardings API
  description: API Account and Onboarding
  version: '1.0'
  contact: {}
servers:
- url: https://onboarding-api.lemonway.com/
  description: Lemonway API
  variables:
    env:
      default: sandbox
      description: Environment name (sandbox, uat, staging, prod)
tags:
- name: Onboardings
paths:
  /onboardings/association:
    post:
      operationId: OnboardingsController_createAssociationOnboarding
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssociationOnboardingRequest'
      responses:
        '201':
          description: Onboarding session created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOnboardingResponse'
        '400':
          description: Missing or invalid request parameters
          content:
            application/json:
              schema: {}
        '401':
          description: Missing or invalid authentication token
          content:
            application/json:
              schema: {}
        '404':
          description: Account not found or does not meet onboarding prerequisites
          content:
            application/json:
              schema: {}
        '409':
          description: Onboarding already initiated for this account
          content:
            application/json:
              schema: {}
        '500':
          description: Unexpected error occurred on the server
          content:
            application/json:
              schema: {}
      security:
      - bearer: []
      tags:
      - Onboardings
      description: Initiates the online onboarding process for a legal entity whose profile status is AWAITING_INFORMATION. This call generates a secure onboarding session and returns a redirect URL where the end-user can complete their onboarding (e.g., KYC checks, document uploads).
      summary: Onboardings controller create association onboarding
      x-summary-source: derived
  /onboardings/company:
    post:
      operationId: OnboardingsController_createCompanyOnboarding
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOnboardingCompanyRequest'
      responses:
        '201':
          description: Onboarding session created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOnboardingResponse'
        '400':
          description: Missing or invalid request parameters
          content:
            application/json:
              schema: {}
        '401':
          description: Missing or invalid authentication token
          content:
            application/json:
              schema: {}
        '404':
          description: Account not found or does not meet onboarding prerequisites
          content:
            application/json:
              schema: {}
        '409':
          description: Onboarding already initiated for this account
          content:
            application/json:
              schema: {}
        '500':
          description: Unexpected error occurred on the server
          content:
            application/json:
              schema: {}
      security:
      - bearer: []
      tags:
      - Onboardings
      description: Initiates the online onboarding process for a legal entity whose profile status is AWAITING_INFORMATION. This call generates a secure onboarding session and returns a redirect URL where the end-user can complete their onboarding (e.g., KYC checks, document uploads).
      summary: Start Legal Entity Online Onboarding
  /onboardings/individual:
    post:
      operationId: OnboardingsController_createOnboarding
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIndividualOnboardingRequest'
      responses:
        '201':
          description: Onboarding session created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOnboardingResponse'
        '400':
          description: Missing or invalid request parameters
          content:
            application/json:
              schema: {}
        '401':
          description: Missing or invalid authentication token
          content:
            application/json:
              schema: {}
        '404':
          description: Account not found or does not meet onboarding prerequisites
          content:
            application/json:
              schema: {}
        '409':
          description: Onboarding already initiated for this account
          content:
            application/json:
              schema: {}
        '500':
          description: Unexpected error occurred on the server
          content:
            application/json:
              schema: {}
      security:
      - bearer: []
      tags:
      - Onboardings
      description: 'If the account’s profile status is awaiting_information, start the onboarding flow.

        To initiate the Online Onboarding process using the POST/onboardings/individual endpoint, you need to submit the same data you used for account creation, along with the accountId (Id) provided in the response. All other data are optional to initiate an Online Onboarding and will be collected directly from the end-user, ensuring compliance with KYC requirements without additional data input from your side.


        Note: Some end-user personal information may be pre-filled when they open onboarding page for the first time, notably the name, email and contact details. We use the initial end-user data you sent us to inject into online onboarding page.


        When you submit the payload, the API will:


        • Identify the account and link the KYC process to it.


        • All mandatory personal, contact, and address data for identity checks.


        • Assesses AML/PEP risk via political exposure, financial profile, and source of funds.


        • Verifies legal eligibility (age, capacity).


        • Understands the user’s business intent (FAREWELL project) and downstream beneficiary.


        • Redirects the user back to your specified redirectUrl once all steps succeed (or fail).'
      summary: Start Individual Online Onboarding
  /onboardings/sole-trader:
    post:
      operationId: OnboardingsController_createSoleTraderOnboarding
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSoleTraderOnboardingRequest'
      responses:
        '201':
          description: Onboarding session created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOnboardingResponse'
        '400':
          description: Missing or invalid request parameters
          content:
            application/json:
              schema: {}
        '401':
          description: Missing or invalid authentication token
          content:
            application/json:
              schema: {}
        '404':
          description: Account not found or does not meet onboarding prerequisites
          content:
            application/json:
              schema: {}
        '409':
          description: Onboarding already initiated for this account
          content:
            application/json:
              schema: {}
        '500':
          description: Unexpected error occurred on the server
          content:
            application/json:
              schema: {}
      security:
      - bearer: []
      tags:
      - Onboardings
      description: Initiates the online onboarding process for a legal entity whose profile status is AWAITING_INFORMATION. This call generates a secure onboarding session and returns a redirect URL where the end-user can complete their onboarding (e.g., KYC checks, document uploads).
      summary: Onboardings controller create sole trader onboarding
      x-summary-source: derived
  /onboardings/{onboardingId}/resume:
    get:
      operationId: OnboardingsController_createUrl
      parameters:
      - name: onboardingId
        required: true
        in: path
        description: Unique ID of the onboarding process
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUrlResponse'
      security:
      - bearer: []
      tags:
      - Onboardings
      description: 'Retrieves a continuation (resume) URL for a previously-started, in-progress onboarding session.


        This allows an end-user to return to their onboarding process after leaving the session without completing it.


        Important:


        The onboardingId must be taken from the response returned by the onboarding creation endpoint (POST /onboardings/company, /association, /sole_trader, /individual).


        This ID is mandatory and must be included in the request path'
      summary: Onboardings controller create url
      x-summary-source: derived
