openapi: 3.2.0
info:
  version: v2
  title: Lemonway DirectKit API 2.0 P2Ps API
servers:
- url: https://ws.lemonway.fr/mb/env-name/prod/directkitrest/
tags:
- name: P2Ps
paths:
  /v2/p2p:
    post:
      tags:
      - P2Ps
      summary: Payment between Payment Accounts (P2P)
      description: 'This call debits Wallet A and credits Wallet B. Payment accounts are internal to Lemonway. You can schedule this payment if you do not want the payment to occure immediately.

        The following list corresponds to the payment type specified in the response attribute called:


        0 Card

        1 Bank transfert (Money-In)

        3 Bank transfert (Money-Out)

        4 P2P

        13 IDEAL

        14 DirectDebit

        15 Cheque

        19 Multibanco

        20 Payshop

        21 MB WAY

        35 PayPal

        **Important:** The following services have been discontinued: 16 Neosurf, 17 SoFort, 18 PFS Physical Card, 20 Payshop, 22 Polish Instant Transfer, 23 PAGARE, 24 MobilePay,26 WeChat (via PayTend),28 MoneyIn by TPE, 29 Trustly.'
      operationId: P2Ps_P2pPost
      parameters:
      - name: Authorization
        in: header
        description: Authorization bearer (OAuth 2)
        required: true
        schema:
          type: string
      - name: PSU-Accept-Language
        in: header
        description: Response language accepted by final client (PSU). English by default
        required: false
        schema:
          type: string
      - name: PSU-IP-Address
        in: header
        description: IP address of the final client (PSU).
        required: true
        schema:
          type: string
      - name: PSU-User-Agent
        in: header
        description: User-agent of the final client (PSU).
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendPaymentInput'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendPaymentOutput'
              examples:
                response:
                  value:
                    transaction:
                      senderAccountId: Pizza56
                      receiverAccountId: pizza
                      debitAmount: 1500
                      creditAmount: 1500
                      isFee: false
                      feeReference: 0
                      id: 255
                      method: 0
                      date: 1784563474
                      commissionAmount: 100
                      comment: Order number 2457765AX2
                      status: 0
                      executionDate: 0
                      reference: Dze8778
        '401':
          description: Unauthorized
        '500':
          description: InternalServerError
    get:
      tags:
      - P2Ps
      summary: Search for Transactions between Payments Accounts
      description: Returns a lit of payment transactions between payments accounts that match the search fields.
      operationId: P2Ps_P2pGet
      parameters:
      - name: transactionId
        in: query
        description: Transaction ID
        required: false
        schema:
          type: integer
          format: int64
      - name: transactionComment
        in: query
        description: Transaction Comment
        required: false
        schema:
          type: string
          minLength: 0
          maxLength: 140
      - name: reference
        in: query
        description: Unique ID generated by your server
        required: false
        schema:
          type: string
          minLength: 0
          maxLength: 36
      - name: privateData.value
        in: query
        description: Up to 20 fields of 256 maximum length
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: page
        in: query
        description: Index start from 1, let null to get all
        required: false
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        description: Default 20, let it null if no pagination
        required: false
        schema:
          type: integer
          format: int32
      - name: Authorization
        in: header
        description: Authorization bearer (OAuth 2)
        required: true
        schema:
          type: string
      - name: PSU-Accept-Language
        in: header
        description: Response language accepted by final client (PSU). English by default
        required: false
        schema:
          type: string
      - name: PSU-IP-Address
        in: header
        description: IP address of the final client (PSU).
        required: true
        schema:
          type: string
      - name: PSU-User-Agent
        in: header
        description: User-agent of the final client (PSU).
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPaymentDetailsOutput'
              examples:
                response:
                  value:
                    transactions:
                      value:
                      - senderAccountId: '33612345678'
                        receiverAccountId: pizza
                        debitAmount: 1500
                        creditAmount: 1500
                        scheduledDate: 2015/12/31
                        isFee: true
                        feeReference: 2365
                        id: 255
                        method: 0
                        date: 1784563474
                        commissionAmount: 100
                        comment: Order number 2457765AX2
                        status: 0
                        executionDate: 0
                        reference: null
        '401':
          description: Unauthorized
        '500':
          description: InternalServerError
components:
  schemas:
    PrivateData:
      description: Data with multiple fields that you can associate to a payment and that you can search with GetPaymentDetails.
      type: object
      properties:
        value:
          description: Up to 20 fields of 256 maximum length
          type: array
          items:
            type: string
    GetPaymentDetailsOutput:
      type: object
      properties:
        transactions:
          $ref: '#/components/schemas/Transactions_TransactionP2P'
        _links:
          $ref: '#/components/schemas/Links'
        error:
          $ref: '#/components/schemas/Error'
    Link:
      type: object
      properties:
        href:
          type: string
        templated:
          type: boolean
          readOnly: true
        method:
          type: string
        type:
          type: string
        deprecation:
          type: string
        name:
          type: string
        profile:
          type: string
        title:
          type: string
        hreflang:
          type: string
    LemonWayCommission:
      type: object
      properties:
        idp2p:
          type: string
        amount:
          format: int32
          description: 'Amounts are represented as integer in cents (Euro)

            Represented as an integer in cents (Euro)'
          type: integer
    Error:
      type: object
      properties:
        code:
          format: int32
          type: integer
        message:
          type: string
        psp:
          $ref: '#/components/schemas/PSP'
    Links:
      type: object
      properties:
        first:
          $ref: '#/components/schemas/Link'
        last:
          $ref: '#/components/schemas/Link'
        previous:
          $ref: '#/components/schemas/Link'
        next:
          $ref: '#/components/schemas/Link'
        self:
          $ref: '#/components/schemas/Link'
    PSP:
      type: object
      properties:
        message:
          description: Get the Error Message from PSP
          type: string
    TransactionP2P:
      type: object
      properties:
        senderAccountId:
          description: Debited Account
          type: string
        receiverAccountId:
          description: Credited Account
          type: string
        debitAmount:
          format: int32
          description: 'Debited Amount

            Amounts are represented in cents (Euro)'
          type: integer
        creditAmount:
          format: int32
          description: 'Credited Amount

            Amounts are represented in cents (Euro)'
          type: integer
        privateData:
          $ref: '#/components/schemas/PrivateData'
        scheduledDate:
          description: Request date for a payment or payment date. UTC unix timestamp
          type: string
        isFee:
          description: Returned 1 for a P2P commission transaction
          type: boolean
        feeReference:
          format: int32
          description: Original transaction ID
          type: integer
        id:
          format: int64
          description: Transaction ID
          type: integer
        method:
          format: int32
          description: "Payment Method  \n0 Card    \n1 Bank transfer (MoneyIn)     \n3 Bank transfer (MoneyOut)     \n4 P2P    \n13 iDEAL    \n14 SEPA DirectDebit    \n15 Cheque    \n19 Multibanco    \n21 MBWAY    \n30 BNPL  \n35 PayPal\n\n ---\n **Important:** The following services have been discontinued. \n \n16 Neosurf  \n17 Sofort  \n18 PFS Physical Card  \n20 Payshop  \n22 Polish Instant Transfer  \n23 Pagare  \n24 MobilePay\n25 Paytrail\n26 WeChat  \n27 P24  \n28 MoneyIn by TPE  \n29 Trustly"
          type: integer
        methodDetails:
          format: int32
          description: 'Payment Method Details

            0 Standard

            1 Pay By Bank<br/>0 = STANDARD.<br/>1 = PAY_BY_BANK.<br/>'
          enum:
          - 0
          - 1
          type: integer
        date:
          format: int32
          description: Transaction initialization date, UTC Unix timestamp
          type: integer
        commissionAmount:
          format: int32
          description: 'Your fee

            Amounts are given as integer numbers in cents'
          type: integer
        comment:
          description: Comment
          type: string
        status:
          format: int32
          description: "**For the following endpoints uses the below status code**   \n  \n/v2/accounts/{accountId}/transactions\n/v2/moneyins\n/v2/moneyins/card/direct\n/v2/moneyins/card/{cardid}/rebill\n/v2/moneyins/card/{cardid}/subscription\n/v2/moneyins/{transactionid}/validate\n/v2/moneyins/sdd/init\n/v2/moneyins/sdd\n/v2/moneyins/{transactionid}/cancel\n/v2/refund/{transactionid}\n/v2/refundcreate/{transactionId}\n            \n0: Success  \n3: Lemonway Error  \n4: Pending  \n6: PSP error  \n7: Cancelled  \n16: Validation pending  \n\n**For the following endpoints uses the below status code**  \n\n/v2/disputes\n/v2/moneyins/bankwire\n/v2/moneyins/card/direct/3dinit\n/v2/moneyouts\n/v2/p2p\n/v2/p2p/{transactionid?}\n            \n0: Waiting for finalization    \n3: Success    \n4: Lemonway Error"
          type: integer
        executionDate:
          format: int32
          description: Transaction execution date
          type: integer
        lemonWayCommission:
          $ref: '#/components/schemas/LemonWayCommission'
        reference:
          description: Unique ID generated by your server
          type: string
    SendPaymentOutput:
      type: object
      properties:
        transaction:
          $ref: '#/components/schemas/TransactionP2P'
        error:
          $ref: '#/components/schemas/Error'
    Transactions_TransactionP2P:
      type: object
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/TransactionP2P'
    SendPaymentInput:
      required:
      - debitAccountId
      - creditAccountId
      type: object
      properties:
        debitAccountId:
          description: Account ID to be Debited
          maxLength: 256
          minLength: 0
          type: string
        creditAccountId:
          description: Account ID to Credited
          maxLength: 256
          minLength: 0
          type: string
        amount:
          format: int32
          description: Payment Amount
          type: integer
        comment:
          description: Payment Comment
          maxLength: 140
          minLength: 0
          type: string
        scheduledDate:
          description: 'If scheduledDate is set, the following rules will apply:

            1. ScheduledDate cannot be equal to the current date, Paris time (CET).

            2. The payment will be inserted but not executed, the status will be pending and necessary checks like user balance or user status will not be checked.

            3. At 1am, Paris time (CET), on [scheduledDate], the checks will be performed and the payment will be finalized.

            **This feature is only available for some partners, contact commercial services for more information.**'
          pattern: ^[12]\d{3}\/(0[1-9]|1[0-2])\/(0[1-9]|[12]\d|3[01])$
          type: string
        privateData:
          $ref: '#/components/schemas/PrivateData'
        originTransactionId:
          format: int32
          description: Origin Transaction Identification
          type: integer
        reference:
          maxLength: 36
          minLength: 0
          type: string
      example:
        debitAccountId: '33612345678'
        creditAccountId: taxi67
        amount: 1500
        comment: Order number 2457765AX2
        scheduledDate: 2026/08/19
        privateData:
          value:
          - My data 1
          - My data 2
          - My data 3
          - ''
          - My data 5
        originTransactionId: 4086
