openapi: 3.2.0
info:
  title: Account & Management Onboarding API
  description: API Account and Onboarding
  version: '1.0'
  contact: {}
servers:
- url: https://onboarding-api.lemonway.com/
  description: Lemonway API
  variables:
    env:
      default: sandbox
      description: Environment name (sandbox, uat, staging, prod)
tags:
- name: Onboarding
paths:
  /onboarding/{onboardingId}/document:
    post:
      operationId: IndividualOnboardingsController_uploadOnboardingDocument
      parameters:
      - name: onboardingId
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                accountId:
                  type: string
                type:
                  type: string
                  enum:
                  - BROCHURE
                  - FAMILY_DOCUMENT
                  - LEGAL_CAPACITY_DOCUMENT
                  - NATIONAL_IDENTITY_CARD
                  - OTHER
                  - PASSPORT
                  - PROOF_OF_ADDRESS
                  - RESIDENCE_PERMIT
                file:
                  type: string
                  format: binary
              required:
              - accountId
              - type
              - file
      responses:
        '200':
          description: Document uploaded successfully. Response includes documentId and status
          content:
            application/json:
              schema:
                example:
                  documentId: a1b2c3d4-e5f6-7890-ab12-cd34ef56gh78
                  status: SUCCESS
        '201':
          description: ''
        '400':
          description: ' Missing parameters, invalid file, or unsupported document type'
          content:
            application/json:
              schema: {}
        '401':
          description: Missing or invalid authentication token
          content:
            application/json:
              schema: {}
        '404':
          description: The specified onboarding session or account could not be found
          content:
            application/json:
              schema: {}
        '500':
          description: ' An unexpected error occurred on the server'
          content:
            application/json:
              schema: {}
      security:
      - bearer: []
      tags:
      - Onboarding
      description: Upload a document associated with an individual currently being onboarded
      summary: Add Document to an Individual in Onboarding
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
