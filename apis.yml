name: Lemonway

description: Lemonway is a European payment institution regulated by the French ACPR (registration 16568) since 2012, providing REST APIs for
  marketplace payments including IBAN wallet creation, bank transfers, card payments, KYC/KYB verification, P2P transfers, and crowdfunding platform
  payment flows. Trusted by over 1,400 marketplaces across Europe.

